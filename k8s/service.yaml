apiVersion: v1
kind: Service
metadata:
  name: kairo-node-sample
  namespace: kairo-kairo-node-sample
  labels:
    app: kairo-node-sample
    app.kubernetes.io/managed-by: kairo
spec:
  # cluster-internal only: all outside traffic comes in through Traefik's
  # Ingress, so request metrics are always counted (FR-39)
  type: ClusterIP
  selector:
    app: kairo-node-sample
  ports:
    - name: http
      port: 80
      targetPort: 3000
